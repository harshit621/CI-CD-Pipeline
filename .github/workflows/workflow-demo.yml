name: Workflow Demo
on:
  push:
    branches:
      - main
      - feature/*
  workflow_dispatch:
jobs:
  workflow-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Start
        run: echo "Workflow started"
      - name: Step 2 - Application
        run: echo "Running application task"
      - name: Step 3 - Testing
        run: echo "Running tests"
      - name: Step 4 - Finish
        run: echo "Workflow completed"
      - name: myself
        run: echo "systemctl"
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Start
        run: echo "Workflow started"
      - name: Step 2 - Application
        run: echo "Running application task"
      - name: Step 3 - Testing
        run: echo "Running tests"
      - name: Step 4 - Finish
        run: echo "Workflow completed"
      - name: myself
        run: echo "journalctl"
  secrets-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available."
          else
            echo "Secret is not configured."
            exit 1
          fi
