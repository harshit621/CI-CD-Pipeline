name: Workflow Demo
on:
  push:
    branches:
      - main
      - feature/*
jobs:
  workflow-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Start
        run: echo "Workflow started"
      - name: Step 2 - Application
        run: echo "Running application task"
      - name: Step 3 - Testing
        run: echo "Running tests"
      - name: Step 4 - Finish
        run: echo "Workflow completed"
      - name: myself
        run: echo "systemctl"

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Run build
        run: |
          chmod +x build.sh
          ./build.sh
      - name: Show build files
        run: |
          echo "Build output:"
          ls -la build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: session16-build
          path: build/ 
